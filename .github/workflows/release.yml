name: Publish Package

on:
  release:
    types: [published]

env:
  PYTHON_VERSION: '3.13'

jobs:
  precommit:
    uses: ./.github/workflows/precommit.yml

  build-for-npm:
    needs: precommit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./deploy/npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Copy the procedure
        run: cp ../../dist/procedure.json ../../README.md ../../LICENSE.md .
      - name: Create the package
        run: npm run build
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: deploy/npm/dist/
          if-no-files-found: error
          retention-days: 1

  deploy-to-npm:
    # IMPORTANT: use a seperate job for this as each step has access to the tokens
    needs: build-for-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
       # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    defaults:
      run:
        working-directory: ./deploy/npm
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: deploy/npm/dist/
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - name: Publish to npm
        run: npm publish --access public

  build-for-pypi:
    needs: precommit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./deploy/pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Copy the procedure
        run: cp ../../dist/procedure.json ./grand_challenge_dicom_de_id_procedure/.
      - run: cp ../../README.md ../../LICENSE.md .
      - name: Build the package
        run: uv build
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: deploy/pypi/dist/
          if-no-files-found: error
          retention-days: 1

  deploy-to-pypi:
    # IMPORTANT: use a seperate job for this as each step has access to the tokens
    needs: build-for-pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
