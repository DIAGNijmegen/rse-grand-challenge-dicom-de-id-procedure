name: Publish Package

on:
  release:
    types: [published]

env:
  PYTHON_VERSION: '3.13'

jobs:
  precommit:
    uses: ./.github/workflows/precommit.yml

  deploy-to-npm:
    needs: precommit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./deploy/npm
    permissions:
      contents: read
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Copy the procedure
        run: cp ../../dist/procedure.json ../../README.md ../../LICENSE.md .
      - name: Create the package
        run: npm run build
      - name: Publish to npm
        run: npm publish --access public

  build-for-pypi:
    needs: precommit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./deploy/pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Copy the procedure
        run: cp ../../dist/procedure.json ./grand_challenge_dicom_de_id_procedure/.
      - run: cp ../../README.md ../../LICENSE.md .
      - name: Build the package
        run: uv build
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: deploy/pypi/dist/
          if-no-files-found: error
          retention-days: 1

  deploy-to-pypi:
    # IMPORTANT: use a seperate job for this as each step has access to the tokens
    needs: build-for-pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
