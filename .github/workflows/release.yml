name: Publish Package

on:
  release:
    types: [published]

env:
  PYTHON_VERSION: '3.13'

jobs:
  precommit:
    uses: ./.github/workflows/precommit.yml

  deploy-to-npm:
    needs: precommit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./deploy/npm
    permissions:
      contents: read
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Copy the procedure
        run: cp ../../dist/procedure.json ../../README.md ../../LICENSE.md .
      - name: Create the package
        run: npm run build
      - name: Publish to npm
        run: npm publish --access public

  build-for-pypi:
    needs: precommit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./deploy/pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Copy the procedure
        run: cp ../../dist/procedure.json ./grand_challenge_dicom_de_id_procedure/.
      - run: cp ../../README.md ../../LICENSE.md .
      - name: Build the package
        run: uv build
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: deploy/pypi/dist/
          if-no-files-found: error
          retention-days: 1

  deploy-to-pypi:
    # IMPORTANT: use a seperate job for this as each step has access to the tokens
    needs: build-for-pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
