name: CI

on: [push, pull_request]

env:
  PYTHON_VERSION: '3.13'

jobs:
  precommit:
    uses: ./.github/workflows/precommit.yml

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Test with uv
        run: uv run pytest
