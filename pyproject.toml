[project]
name = "grand-challenge-dicom-deid-procedure-generator"
description = "De-identification procedure generator that descibes how to de-identify DICOM files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"
